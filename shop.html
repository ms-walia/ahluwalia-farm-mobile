<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Buy raw honey from Ahluwalia Farm in 250g, 500g and 1kg jars.">
  <title>Buy Honey | Ahluwalia Farm</title>
  <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* mobile-first: one big jar per card on phones, three columns from 760px */
    body { background: #1f190f; color: var(--cream); }
    .shop-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 1.25rem; }
    .shop-top a { color: var(--cream); display: inline-flex; align-items: center; gap: 10px; font-weight: 500; min-height: 44px; }
    .shop-top img { width: 40px; height: 40px; border-radius: 50%; }
    .shop-back { opacity: .85; font-size: .95rem; }
    .shop-hero { text-align: center; padding: 1.5rem 1.25rem .5rem; }
    .shop-hero .kicker { color: var(--gold-light); letter-spacing: .2em; text-transform: uppercase; font-size: .72rem; font-weight: 600; }
    .shop-hero h1 { font-family: var(--font-serif); font-size: clamp(2.2rem, 9vw, 4rem); font-weight: 600; line-height: 1.1; margin: .4rem 0 .6rem; color: var(--cream); }
    .shop-hero p { max-width: 620px; margin: 0 auto; color: rgba(250,248,242,.82); }
    .sizes { display: grid; grid-template-columns: 1fr; gap: 1.25rem; max-width: 460px; margin: 1.75rem auto 2rem; padding: 0 1.25rem; }
    .size-card { background: #faf8f2; color: #2b2b2b; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 18px 40px rgba(0,0,0,.35); position: relative; }
    .size-card__img { aspect-ratio: 1 / 1; width: 100%; position: relative; background: radial-gradient(70% 60% at 50% 40%, #ffffff, #f3ead0); }
    .size-card__img canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .size-card__img img { position: absolute; inset: 10% 20%; width: 60%; height: 80%; object-fit: contain; }
    .size-card__body { padding: 1.1rem 1.4rem 1.4rem; display: flex; flex-direction: column; gap: 6px; }
    .size-card__size { font-family: var(--font-serif); font-size: 2rem; font-weight: 700; color: var(--forest-green); line-height: 1; }
    .size-card__name { font-size: .92rem; color: #6d6455; }
    .size-card__price { font-size: 1.5rem; font-weight: 600; margin-top: 4px; }
    .size-card__btn { margin-top: 10px; min-height: 52px; border: 0; border-radius: 999px; padding: 13px 18px; background: var(--forest-green); color: #fff; font: 600 1rem var(--font-sans); cursor: pointer; }
    .size-card__btn:active { transform: scale(.98); }
    .size-card__tag { position: absolute; top: 14px; left: 14px; z-index: 2; background: var(--honey-gold); color: #1d1608; font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; letter-spacing: .04em; }
    .shop-hint { text-align: center; font-size: .8rem; letter-spacing: .06em; color: rgba(250,248,242,.6); margin-top: -.75rem; }
    .shop-others { text-align: center; padding: .5rem 1.25rem 4rem; }
    .shop-others h2 { font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: .8rem; color: var(--cream); }
    .shop-others a { display: inline-flex; align-items: center; min-height: 44px; margin: 4px; padding: 0 1.1rem; border-radius: 999px; border: 1px solid rgba(232,197,71,.45); color: var(--gold-light); font-size: .92rem; }
    .shop-others a[aria-current] { background: var(--gold-light); color: #1d1608; }
    @media (min-width: 760px) {
      .sizes { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 1100px; gap: 1.75rem; }
    }
  </style>
</head>
<body>
  <header class="shop-top">
    <a href="index.html#jar-journey"><img src="assets/logo.jpg" alt="" width="40" height="40">Ahluwalia Farm</a>
    <a class="shop-back" href="index.html#jar-journey">← Back to honey</a>
  </header>
  <main>
    <section class="shop-hero">
      <span class="kicker" id="shop-region"></span>
      <h1 id="shop-title">Honey</h1>
      <p>Raw &amp; unprocessed, in three jar sizes. Add to your basket and send the order to us on WhatsApp — we'll confirm delivery.</p>
    </section>
    <section class="sizes" id="sizes" aria-label="Jar sizes"></section>
    <p class="shop-hint">Swipe a jar to turn it</p>
    <section class="shop-others">
      <h2>Other honeys</h2>
      <nav id="others"></nav>
    </section>
  </main>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import { HONEY, inr } from './js/cart.js';
    import { mountJar } from './js/jar-mini.js';
    const key = new URLSearchParams(location.search).get('v') || 'multiflora';
    const V = HONEY[key] ? key : 'multiflora';
    const h = HONEY[V];
    document.title = `Buy ${h.name} | Ahluwalia Farm`;
    document.getElementById('shop-title').textContent = h.name;
    document.getElementById('shop-region').textContent = h.region;
    const img = `assets/shop/${V}-label.jpg`;
    document.getElementById('sizes').innerHTML = Object.entries(h.prices).map(([size, price], i) => `
      <article class="size-card" data-size="${size}">
        ${i === 2 ? '<span class="size-card__tag">BEST VALUE</span>' : ''}
        <div class="size-card__img" data-jar="${size}"><img src="${img}" alt="${h.name} label"></div>
        <div class="size-card__body">
          <div class="size-card__size">${size}</div>
          <div class="size-card__name">${h.name}</div>
          <div class="size-card__price">${inr(price)}</div>
          <button class="size-card__btn" data-add='${JSON.stringify({ id: V + '-' + size, name: h.name, size, price })}'>Add to cart</button>
        </div>
      </article>`).join('');
    const SCALE = { '250g': 0.8, '500g': 0.9, '1kg': 1 };
    document.querySelectorAll('[data-jar]').forEach((el) => {
      const size = el.dataset.jar;
      mountJar(el, { variety: V, size, scale: SCALE[size] })
        .then(() => { const im = el.querySelector('img'); if (im) im.remove(); })
        .catch((e) => console.warn('jar', e));
    });
    document.getElementById('others').innerHTML = Object.entries(HONEY).map(([k, v]) =>
      `<a href="shop.html?v=${k}" ${k === V ? 'aria-current="page"' : ''}>${v.name.replace(' Honey', '')}</a>`).join('');
  </script>
</body>
</html>
